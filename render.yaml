# Render Blueprint — SIH 26181 companion backend + dashboard

services:
  - type: web
    name: ai-health-companion
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /system/status
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: COMPANION_DEMO_MODE
        value: "false"
      - key: RAINFALL_PROVIDER
        value: nwdp
      - key: COMPANION_MODEL_SCALE
        value: standard
      - key: COMPANION_API_TOKEN
        generateValue: true
